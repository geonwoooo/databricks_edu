<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Databricks Associate (160문항)</title>

    <style>
        :root {
            --primary-color: #ff3600;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        header p {
            margin: 5px 0 0;
            color: #666;
            font-size: 0.9rem;
        }

        .controls {
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1rem;
            background-color: #fff;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .question-header {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #222;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-prev,
        .btn-next {
            background-color: #e9ecef;
            color: #495057;
        }

        .btn-answer {
            background-color: var(--primary-color);
            color: white;
        }

        .answer-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #e7f5ff;
            border-radius: 8px;
            border-left: 4px solid #1c7ed6;
            display: none;
            white-space: pre-wrap;
        }

        .answer-box.show {
            display: block;
        }

        .status {
            margin-bottom: 12px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Databricks Associate (160문항)</h1>
        <p>questions_full.json 연동 버전</p>
    </header>

    <div class="controls">

        <select id="daySelect" onchange="changeDay()">
            <option value="all">전체 문제 보기 (1 ~ 160)</option>
            <option value="1">Day 1 (1 ~ 16)</option>
            <option value="2">Day 2 (17 ~ 32)</option>
            <option value="3">Day 3 (33 ~ 48)</option>
            <option value="4">Day 4 (49 ~ 64)</option>
            <option value="5">Day 5 (65 ~ 80)</option>
            <option value="6">Day 6 (81 ~ 96)</option>
            <option value="7">Day 7 (97 ~ 112)</option>
            <option value="8">Day 8 (113 ~ 128)</option>
            <option value="9">Day 9 (129 ~ 144)</option>
            <option value="10">Day 10 (145 ~ 160)</option>
        </select>

    </div>

    <div class="quiz-card">

        <div class="status" id="progressInfo"></div>

        <div
            class="question-header"
            id="questionTitle">

            문제를 불러오는 중...
        </div>

        <div class="btn-group">
            <button class="btn-prev" onclick="prevQuestion()">이전</button>
            <button class="btn-answer" onclick="toggleAnswer()">정답 확인</button>
            <button class="btn-next" onclick="nextQuestion()">다음</button>
        </div>

        <div class="answer-box" id="answerBox">

            <strong>
                정답:
                <span id="correctAnswer"></span>
            </strong>

            <hr>

            <p id="explanationText"></p>

        </div>

    </div>

</div>

<script>

let questionsData = [];
let currentFilteredQuestions = [];
let currentIndex = 0;

const dayRanges = {
    1: [1,16],
    2: [17,32],
    3: [33,48],
    4: [49,64],
    5: [65,80],
    6: [81,96],
    7: [97,112],
    8: [113,128],
    9: [129,144],
    10:[145,160]
};

async function initApp() {

    try {

        const response =
            await fetch("questions_full.json");

        questionsData =
            await response.json();

        currentFilteredQuestions =
            [...questionsData];

        renderQuestion();

    }
    catch(error) {

        document.getElementById(
            "questionTitle"
        ).innerText =
        "questions_full.json 로딩 실패";

        console.error(error);

    }
}

function renderQuestion() {

    if(currentFilteredQuestions.length === 0){

        document.getElementById(
            "questionTitle"
        ).innerText =
        "문제가 없습니다.";

        return;
    }

    const q =
        currentFilteredQuestions[currentIndex];

    document.getElementById(
        "progressInfo"
    ).innerText =
    `${currentIndex + 1} / ${currentFilteredQuestions.length}`;

    document.getElementById(
        "questionTitle"
    ).innerText =
    `[문제 ${q.id}]\n\n${q.question}`;

    document.getElementById(
        "correctAnswer"
    ).innerText =
    q.answer;

    document.getElementById(
        "explanationText"
    ).innerText =
    q.explanation || "해설 없음";

    document
        .getElementById("answerBox")
        .classList
        .remove("show");
}

function changeDay() {

    const day =
        document.getElementById(
            "daySelect"
        ).value;

    if(day === "all") {

        currentFilteredQuestions =
            [...questionsData];

    } else {

        const [start,end] =
            dayRanges[day];

        currentFilteredQuestions =
            questionsData.filter(
                q => q.id >= start &&
                     q.id <= end
            );
    }

    currentIndex = 0;

    renderQuestion();
}

function nextQuestion() {

    if(
        currentIndex <
        currentFilteredQuestions.length - 1
    ){
        currentIndex++;
        renderQuestion();
    }
}

function prevQuestion() {

    if(currentIndex > 0){

        currentIndex--;
        renderQuestion();
    }
}

function toggleAnswer() {

    document
        .getElementById("answerBox")
        .classList
        .toggle("show");
}

initApp();

</script>

</body>
</html>
