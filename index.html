<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Databricks Associate (228문항)</title>
    <style>
        :root {
            --primary-color: #ff3600;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        header p {
            margin: 5px 0 0;
            color: #666;
            font-size: 0.9rem;
        }

        .controls {
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1rem;
            background-color: #fff;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .question-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #222;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .option-item {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-item:hover {
            background-color: #f1f3f5;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-prev, .btn-next {
            background-color: #e9ecef;
            color: #495057;
        }

        .btn-answer {
            background-color: var(--primary-color);
            color: white;
        }

        .answer-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #e7f5ff;
            border-radius: 8px;
            border-left: 4px solid #1c7ed6;
            display: none;
        }

        .answer-box.show {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Databricks Associate (228문항)</h1>
        <p>10일 완성 모바일 학습 앱</p>
    </header>

    <div class="controls">
        <select id="daySelect" onchange="changeDay()">
            <option value="all">전체 문제 보기 (1 ~ 228)</option>
            <option value="1">Day 1 (문제 1 ~ 23)</option>
            <option value="2">Day 2 (문제 24 ~ 46)</option>
            <option value="3">Day 3 (문제 47 ~ 69)</option>
            <option value="4">Day 4 (문제 70 ~ 92)</option>
            <option value="5">Day 5 (문제 93 ~ 115)</option>
            <option value="6">Day 6 (문제 116 ~ 138)</option>
            <option value="7">Day 7 (문제 139 ~ 161)</option>
            <option value="8">Day 8 (문제 162 ~ 184)</option>
            <option value="9">Day 9 (문제 185 ~ 206)</option>
            <option value="10">Day 10 (문제 207 ~ 228)</option>
        </select>
    </div>

    <div class="quiz-card">
        <div class="question-header" id="questionTitle">문제를 불러오는 중...</div>
        <ul class="options-list" id="optionsList"></ul>
        
        <div class="btn-group">
            <button class="btn-prev" onclick="prevQuestion()">이전</button>
            <button class="btn-answer" onclick="toggleAnswer()">정답 확인</button>
            <button class="btn-next" onclick="nextQuestion()">다음</button>
        </div>

        <div class="answer-box" id="answerBox">
            <strong>정답: <span id="correctAnswer"></span></strong>
            <p id="explanationText" style="margin: 8px 0 0 0; font-size: 0.9rem; color: #495057;"></p>
        </div>
    </div>
</div>

<script>
// 1. 문제 데이터셋 정의 (228개까지 확장 가능 구조)
const questionsData = [
    {
        id: 1,
        question: "1. Databricks Lakehouse Platform의 핵심 아키텍처적 장점은 무엇인가요?",
        options: [
            "A. Data Warehouse와 Data Lake의 장점을 결합하여 단일 플랫폼에서 지원한다.",
            "B. 오직 비정형 데이터만을 처리하기 위해 설계되었다.",
            "C. 실시간 데이터 스트리밍을 지원하지 않는다.",
            "D. 온프레미스 서버 환경에서만 동작한다."
        ],
        answer: "A",
        explanation: "Lakehouse 플랫폼은 데이터 레이크의 유연성과 데이터 웨어하우스의 ACID 트랜잭션 기능을 결합합니다."
    },
    {
        id: 2,
        question: "2. Delta Lake에서 ACID 트랜잭션을 보장하는 메커니즘은 무엇인가요?",
        options: [
            "A. Transaction Log (_delta_log)",
            "B. Redo Log",
            "C. Checkpoint Engine",
            "D. Savepoint System"
        ],
        answer: "A",
        explanation: "Delta Lake는 _delta_log 커밋 로그를 통해 트랜잭션의 원자성과 일관성을 보장합니다."
    },
    {
        id: 3,
        question: "3. Medallion Architecture의 Bronze 계층의 주된 역할은 무엇인가요?",
        options: [
            "A. 원천 시스템 데이터를 정제 없이 원형 그대로(Raw Data) 저장한다.",
            "B. 비즈니스 규칙이 적용된 최종 집계 데이터를 제공한다.",
            "C. 결측치 처리 및 데이터 타입 변환이 완료된 데이터를 저장한다.",
            "D. 머신러닝 모델의 피처 저장소 전용 계층이다."
        ],
        answer: "A",
        explanation: "Bronze 계층은 소스 시스템의 데이터를 변경 없이 Raw 상태로 캡처하는 스트리밍/배치 입구 역할을 합니다."
    },
    {
        id: 4,
        question: "4. Delta Lake의 Silver 계층에서 주로 수행하는 작업은 무엇인가요?",
        options: [
            "A. 원천 데이터 캡처",
            "B. 데이터 정제, 필터링, 보강 및 타입 변환",
            "C. 최종 대시보드 리포팅",
            "D. 데이터 삭제 후 아카이빙"
        ],
        answer: "B",
        explanation: "Silver 계층은 Bronze의 원천 데이터를 정제(Cleaned & Conformed)하여 분석에 적합하게 만듭니다."
    }
    // ... 228번 문제까지 동일한 패턴으로 추가
];

// Day별 범위 정의
const dayRanges = {
    1: [1, 23],
    2: [24, 46],
    3: [47, 69],
    4: [70, 92],
    5: [93, 115],
    6: [116, 138],
    7: [139, 161],
    8: [162, 184],
    9: [185, 206],
    10: [207, 228]
};

let currentFilteredQuestions = [...questionsData];
let currentIndex = 0;

function renderQuestion() {
    if (currentFilteredQuestions.length === 0) {
        document.getElementById('questionTitle').innerText = "해당 조건에 문제가 없습니다.";
        document.getElementById('optionsList').innerHTML = "";
        return;
    }

    const q = currentFilteredQuestions[currentIndex];
    document.getElementById('questionTitle').innerText = `[${q.id} / 228] ${q.question}`;
    
    const optionsList = document.getElementById('optionsList');
    optionsList.innerHTML = q.options.map(opt => `<li class="option-item">${opt}</li>`).join('');

    document.getElementById('correctAnswer').innerText = q.answer;
    document.getElementById('explanationText').innerText = q.explanation || "해설이 없습니다.";
    
    // 정답 박스 숨기기
    document.getElementById('answerBox').classList.remove('show');
}

function changeDay() {
    const selectedDay = document.getElementById('daySelect').value;
    
    if (selectedDay === 'all') {
        currentFilteredQuestions = [...questionsData];
    } else {
        const [start, end] = dayRanges[selectedDay];
        currentFilteredQuestions = questionsData.filter(q => q.id >= start && q.id <= end);
    }
    
    currentIndex = 0;
    renderQuestion();
}

function nextQuestion() {
    if (currentIndex < currentFilteredQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        alert("현재 범위의 마지막 문제입니다.");
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    } else {
        alert("첫 번째 문제입니다.");
    }
}

function toggleAnswer() {
    const answerBox = document.getElementById('answerBox');
    answerBox.classList.toggle('show');
}

// 초기화
renderQuestion();
</script>
</body>
</html>
